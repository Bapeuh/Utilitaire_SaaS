services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: utilitaire
      POSTGRES_USER: utilitaire
      POSTGRES_PASSWORD: utilitaire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utilitaire -d utilitaire"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: utilitaire
      MINIO_ROOT_PASSWORD: utilitaire-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
